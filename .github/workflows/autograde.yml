name: AutoGrade

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: autograde-${{ github.repository }}
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Submit commit for grading
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}

          # CHANGE ONLY THIS VALUE FOR EACH ASSIGNMENT
          ASSIGNMENT_KEY: cs201lab2

        run: |
          MAX_ATTEMPTS=60
          RETRY_DELAY=15
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

            echo "Submitting to AutoGrade..."
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              -X POST \
              "https://autograder.workautomate.cc/api/grade" \
              -H "Content-Type: application/json" \
              -d "{
                \"assignment\": \"$ASSIGNMENT_KEY\",
                \"repository\": \"$REPOSITORY\",
                \"commit_sha\": \"$COMMIT_SHA\"
              }")

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi

            if [ "$HTTP_CODE" = "429" ]; then

              echo
              echo "AutoGrade is currently grading another submission."
              echo "Waiting ${RETRY_DELAY} seconds before retrying..."
              echo

              sleep "$RETRY_DELAY"

              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            echo
            echo "AutoGrade returned an error:"
            python -m json.tool response.json || cat response.json

            exit 1

          done

          if [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; then
            echo
            echo "AutoGrade remained busy for too long."
            echo "Please push again later."
            exit 1
          fi

          echo
          echo "AutoGrade response:"
          python -m json.tool response.json

          python - <<'PY'
          import json
          import sys

          with open(
              "response.json",
              "r",
              encoding="utf-8",
          ) as file:
              result = json.load(file)

          score = result["score"]
          max_score = result["max_score"]

          print()
          print("=" * 50)
          print(
              f"AutoGrade result: "
              f"{score}/{max_score}"
          )
          print("=" * 50)
          print()

          for test in result["tests"]:

              symbol = (
                  "PASS"
                  if test["passed"]
                  else "FAIL"
              )

              print(
                  f"{symbol}: "
                  f"{test['name']} "
                  f"({test['awarded']}/"
                  f"{test['points']})"
              )

              feedback = test.get(
                  "feedback"
              )

              if feedback:
                  print()
                  print("Feedback:")
                  print(feedback)
                  print()

              runtime_ms = test.get("runtime_ms")
              
              if runtime_ms is not None:
                  print(
                      f"Runtime: {runtime_ms:.3f} ms"
                  )
                  
          print()

          if result["passed"]:
              print(
                  "All AutoGrade tests passed."
              )
          else:
              print(
                  "Some AutoGrade tests did not pass."
              )
              sys.exit(1)
          PY
